name: Clear contact email

on:
  push:
    paths:
      - '.github/workflows/clear-contact-email.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clear-email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clear default contact email
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('blog.config.js')
          text = path.read_text(encoding='utf-8')
          updated, count = re.subn(
              r"(?m)^(\s*CONTACT_EMAIL:\s*process\.env\.NEXT_PUBLIC_CONTACT_EMAIL\s*\|\|)\s*'[^']*'(,.*)$",
              r"\1 ''\2",
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('CONTACT_EMAIL default was not found or was ambiguous')
          path.write_text(updated, encoding='utf-8')
          PY

      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog.config.js
          git commit -m "Remove public contact email"
          git push
