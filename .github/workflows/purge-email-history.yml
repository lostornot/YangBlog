name: Purge email from Git history

on:
  push:
    paths:
      - '.github/workflows/purge-email-history.yml'

permissions:
  contents: write

jobs:
  purge:
    if: github.event.head_commit.message == 'Run one-time email history cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch all branches and tags
        run: |
          git fetch origin '+refs/heads/*:refs/heads/*' '+refs/tags/*:refs/tags/*'

      - name: Install git-filter-repo
        run: python -m pip install --user git-filter-repo

      - name: Rewrite history
        env:
          TARGET_B64: REMOVED_BASE64_EMAIL
        run: |
          python - <<'PY'
          import base64, os
          target = base64.b64decode(os.environ['TARGET_B64'])
          with open('/tmp/replacements.txt', 'wb') as f:
              f.write(b'literal:' + target + b'==>\n')
          PY
          export PATH="$HOME/.local/bin:$PATH"
          git filter-repo --force --replace-text /tmp/replacements.txt

      - name: Remove this one-time workflow
        run: |
          git checkout main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/purge-email-history.yml
          git add .github/workflows/purge-email-history.yml
          git commit -m 'Remove one-time history cleanup workflow'

      - name: Force-push rewritten refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin --all
          git push --force origin --tags
          for branch in history-cleanup history-cleanup-backup history-cleanup-backup-2 history-cleanup-backup-3 history-cleanup-backup-4 history-cleanup-backup-5 history-cleanup-backup-6 history-cleanup-backup-7 history-cleanup-backup-8; do
            git push origin --delete "$branch" || true
          done

      - name: Verify target is absent from reachable history
        env:
          TARGET_B64: REMOVED_BASE64_EMAIL
        run: |
          TARGET="$(printf '%s' "$TARGET_B64" | base64 -d)"
          if git log --all -S"$TARGET" --oneline | grep -q .; then
            echo 'Target still exists in reachable history'
            exit 1
          fi
