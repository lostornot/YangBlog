name: Purge email from Git history

on:
  push:
    paths:
      - '.github/workflows/purge-email-history.yml'

permissions:
  contents: write

jobs:
  purge:
    if: github.event.head_commit.message == 'Run corrected one-time history cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Install git-filter-repo
        run: python -m pip install --user git-filter-repo

      - name: Rewrite main history
        env:
          TARGET_B64: REMOVED_BASE64_EMAIL
        run: |
          python - <<'PY'
          import base64, os
          target = base64.b64decode(os.environ['TARGET_B64'])
          with open('/tmp/replacements.txt', 'wb') as f:
              f.write(b'literal:' + target + b'==>\n')
          PY
          export PATH="$HOME/.local/bin:$PATH"
          git filter-repo --force --replace-text /tmp/replacements.txt --refs refs/heads/main

      - name: Remove this one-time workflow
        run: |
          git checkout main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/purge-email-history.yml
          git add .github/workflows/purge-email-history.yml
          git commit -m 'Remove one-time history cleanup workflow'

      - name: Force-push rewritten main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git remote remove origin || true
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin refs/heads/main:refs/heads/main

      - name: Verify target is absent
        env:
          TARGET_B64: REMOVED_BASE64_EMAIL
        run: |
          TARGET="$(printf '%s' "$TARGET_B64" | base64 -d)"
          if git log main -S"$TARGET" --oneline | grep -q .; then
            echo 'Target still exists in main history'
            exit 1
          fi
